# Optional: starts MySQL and MongoDB matching .env.example
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: spendsense_pw
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
volumes:
  mysql_data:
  mongo_data:
